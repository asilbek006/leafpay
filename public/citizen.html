<html lang="uz">

<meta http-equiv="X-Content-Type-Options" content="nosniff">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root {
  --g: #10B981;
  --g-dark: #059669;
  --g-grad: linear-gradient(135deg, #10B981 0%, #059669 100%);
  --gl: #EBFBF3;
  --bg: #F4FAF6;
  --card: #FFFFFF;
  --card-sub: #F8FCFA;
  --tx: #0D2619;
  --mu: #5E7A6B;
  --bd: #DCEEE3;
  --bt: #FFFFFF;
  --bad: #EF4444;
  --warn: #F59E0B;
  --blue: #3B82F6;
  --gold: #F59E0B;
  --shadow: 0 4px 20px rgba(16, 185, 129, 0.08);
  --shadow-lg: 0 10px 30px rgba(16, 185, 129, 0.15);
  color-scheme: light;
}

:root[data-theme="dark"] {
  --g: #34D399;
  --g-dark: #10B981;
  --g-grad: linear-gradient(135deg, #064E3B 0%, #065F46 100%);
  --gl: #0B291D;
  --bg: #09140E;
  --card: #112419;
  --card-sub: #162E21;
  --tx: #EEFBF4;
  --mu: #809E8F;
  --bd: #1B3828;
  --bt: #041B10;
  --bad: #F87171;
  --warn: #FBBF24;
  --blue: #60A5FA;
  --gold: #FBBF24;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) {
    --g: #34D399;
    --g-dark: #10B981;
    --g-grad: linear-gradient(135deg, #064E3B 0%, #065F46 100%);
    --gl: #0B291D;
    --bg: #09140E;
    --card: #112419;
    --card-sub: #162E21;
    --tx: #EEFBF4;
    --mu: #809E8F;
    --bd: #1B3828;
    --bt: #041B10;
    --bad: #F87171;
    --warn: #FBBF24;
    --blue: #60A5FA;
    --gold: #FBBF24;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  background: #E2ECE5;
  color: var(--tx);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 14px 0;
}

#device-wrapper {
  width: 100%;
  max-width: 420px;
  min-height: 870px;
  background: var(--bg);
  border-radius: 46px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.22), 0 0 0 10px #1E293B, 0 0 0 12px #0F172A;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

@media(max-width: 480px){
  body { padding: 0; background: var(--bg); }
  #device-wrapper {
    max-width: 100%;
    min-height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
}

/* Status Bar & Dynamic Island */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 22px 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--tx);
  user-select: none;
  position: relative;
  z-index: 10;
}
.sb-time { font-size: 14px; font-weight: 700; width: 54px; }
.dynamic-island {
  width: 90px;
  height: 25px;
  background: #000;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
}
.di-cam {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #111;
  border: 1px solid #222;
}
.sb-icons {
  display: flex;
  gap: 6px;
  align-items: center;
  width: 54px;
  justify-content: flex-end;
}
.sb-icons svg { width: 16px; height: 16px; fill: currentColor; }

#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
}

main {
  padding: 12px 18px 100px;
  flex: 1;
}

/* Common Components */
h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
h2 { font-size: 16px; font-weight: 700; margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: center; }
.mu { color: var(--mu); font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; }
.sp { justify-content: space-between; }
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 14px;
  font-size: 15px;
  font-weight: 700;
  background: var(--g-grad);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(0.98); }
.btn.sec {
  background: var(--gl);
  color: var(--g-dark);
  box-shadow: none;
  border: 1px solid var(--bd);
}
.btn:disabled { opacity: .5; cursor: not-allowed; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--gl);
  color: var(--g-dark);
  border-radius: 20px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--bd);
}

/* User Header */
.user-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.u-left { display: flex; align-items: center; gap: 10px; }
.u-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--gl);
  border: 2px solid var(--g);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  overflow: hidden;
}
.u-name { font-size: 16px; font-weight: 800; }
.u-sub { font-size: 12px; color: var(--mu); }
.u-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  font-size: 16px;
}
.badge-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bad);
  border: 1px solid var(--card);
}

/* Hero Balance Card */
.hero-card {
  background: var(--g-grad);
  color: #fff;
  border-radius: 24px;
  padding: 18px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
  cursor: pointer;
}
.hero-card .h-tag {
  font-size: 13px;
  font-weight: 600;
  opacity: .92;
  margin-bottom: 8px;
}
.hero-card .h-bal {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.hero-card .h-bal .coin-badge {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #FBBF24;
  color: #78350F;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.hero-card .h-arr {
  margin-left: 6px;
  font-size: 18px;
  opacity: .7;
}
.hero-card .h-sprout {
  position: absolute;
  right: 6px;
  bottom: -4px;
  width: 140px;
  height: 105px;
  pointer-events: none;
}

/* 3 Quick Action Cards */
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.q-card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: var(--shadow);
}
.q-card:active { transform: scale(0.96); }
.q-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.q-card.c-green .q-icon { background: #D1FAE5; color: #059669; }
.q-card.c-blue .q-icon { background: #DBEAFE; color: #2563EB; }
.q-card.c-red .q-icon { background: #FEE2E2; color: #DC2626; }
.q-label { font-size: 12px; font-weight: 700; line-height: 1.25; }

/* My Impact Card */
.impact-card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.impact-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.impact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.imp-col {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: var(--card-sub);
  border-radius: 14px;
  border: 1px solid var(--bd);
}
.imp-col .e { font-size: 18px; }
.imp-col b { font-size: 16px; font-weight: 800; display: block; }
.imp-col span { font-size: 11px; color: var(--mu); }

/* Daily Task & Strike Card */
.task-card {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(5, 150, 105, 0.03));
  border: 1.5px solid rgba(16, 185, 129, 0.3);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.task-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #D1FAE5;
  color: #059669;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex: none;
}
.task-info { flex: 1; }
.task-info b { font-size: 14px; display: block; margin-bottom: 2px; }
.task-info p { font-size: 12px; color: var(--mu); }
.strike-bar {
  height: 6px;
  border-radius: 4px;
  background: rgba(16, 185, 129, 0.15);
  margin-top: 6px;
  overflow: hidden;
}
.strike-bar i { display: block; height: 100%; border-radius: 4px; background: var(--g); }

/* Partners Row */
.partners-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.partner-card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.p-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.p-metro { background: #DBEAFE; color: #1D4ED8; font-weight: 800; font-size: 18px; }
.p-korzinka { background: #FEE2E2; color: #DC2626; }
.p-cafe { background: #FEF3C7; color: #B45309; }
.p-name { font-size: 11px; font-weight: 700; }
.p-coin { font-size: 10px; color: var(--mu); }

/* Motivation Banner */
.moti-banner {
  background: var(--g-grad);
  color: #fff;
  border-radius: 20px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
  margin-bottom: 16px;
  cursor: pointer;
}
.moti-banner span { font-size: 20px; }
.moti-banner b { font-size: 13px; flex: 1; }
.moti-banner i { font-style: normal; opacity: .8; font-size: 14px; }

/* Bottom Nav */
nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--bd);
  display: flex;
  justify-content: space-around;
  padding: 10px 8px 18px;
  z-index: 20;
}
nav button {
  background: none;
  border: 0;
  color: var(--mu);
  font-size: 11px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  flex: 1;
}
nav button.on { color: var(--g); font-weight: 800; }
nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
nav button.plus {
  background: var(--g-grad);
  color: #fff;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  flex: none;
  margin-top: -24px;
  font-size: 28px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.45);
}

/* Action Screen */
.action-big-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border: 2px solid var(--bd);
  border-radius: 20px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all .15s;
}
.action-big-card.on {
  border-color: var(--g);
  background: var(--gl);
}
.abc-img {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: var(--card-sub);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex: none;
}
.abc-content { flex: 1; }
.abc-content b { font-size: 15px; display: block; margin-bottom: 3px; }
.abc-content p { font-size: 12px; color: var(--mu); }
.abc-reward {
  font-size: 12px;
  font-weight: 800;
  color: var(--g-dark);
  background: rgba(16, 185, 129, 0.15);
  padding: 4px 8px;
  border-radius: 12px;
  white-space: nowrap;
}

.photo-preview {
  height: 220px;
  border-radius: 20px;
  background: var(--gl);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  overflow: hidden;
  margin: 12px 0;
  border: 2px dashed var(--g);
  position: relative;
}
.photo-preview img, .photo-preview video { width: 100%; height: 100%; object-fit: cover; }

/* Login Screen (Mockup 1 Match) */
.login-header-art {
  height: 240px;
  background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 60%, var(--bg) 100%);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px 24px;
  overflow: hidden;
}
.login-header-art svg.skyline {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 180px;
  opacity: .95;
}
.login-header-art .lang-float {
  position: absolute;
  top: 14px;
  right: 18px;
  display: flex;
  gap: 4px;
  z-index: 5;
}
.login-header-art .lang-float button {
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--bd);
  color: var(--tx);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.login-header-art .lang-float button.on {
  background: var(--g);
  color: #fff;
  border-color: var(--g);
}
.login-brand {
  position: relative;
  z-index: 2;
  margin-bottom: 4px;
}
.login-brand .logo-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 32px;
  font-weight: 900;
  color: #065F46;
  letter-spacing: -0.5px;
}
.login-brand p {
  font-size: 13px;
  color: #047857;
  font-weight: 600;
  margin-top: 2px;
}

.input-group {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1.5px solid var(--bd);
  border-radius: 16px;
  padding: 0 14px;
  margin-bottom: 12px;
  transition: border-color .15s;
}
.input-group:focus-within { border-color: var(--g); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
.input-group.bad-f { border-color: var(--bad); }
.input-group .i-icon { font-size: 18px; opacity: .7; }
.input-group input, .input-group select {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  padding: 14px 0;
  font-size: 15px;
  color: var(--tx);
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  color: var(--mu);
  font-size: 13px;
  margin: 14px 0;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--bd);
}
.divider:not(:empty)::before { margin-right: .8em; }
.divider:not(:empty)::after { margin-left: .8em; }

.terms-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--mu);
  margin-top: 14px;
  cursor: pointer;
}

/* Modals */
.modal-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99;
  padding: 16px;
}
.modal-box {
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 26px;
  padding: 22px;
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow-lg);
}

.toast {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: #064E3B;
  color: #fff;
  padding: 10px 18px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 13px;
  z-index: 90;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  text-align: center;
  max-width: 85%;
}

#lmap { height: 280px; border-radius: 20px; border: 1px solid var(--bd); z-index: 1; }

* { font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
:root {
  --g:#16A34A; --g-dark:#15803D;
  --g-grad:linear-gradient(135deg,#34C759 0%,#16A34A 55%,#0F7A38 100%);
  --gl:#E7F7EC; --bg:#F3FAF4; --card:rgba(255,255,255,.88); --card-sub:rgba(244,251,246,.9);
  --tx:#10281B; --mu:#5F7B6B; --bd:rgba(22,163,74,.14);
  --shadow:0 6px 22px rgba(22,101,52,.09); --shadow-lg:0 16px 40px rgba(22,101,52,.18);
}
:root[data-theme="dark"] {
  --g:#3DDC84; --g-dark:#22C55E;
  --g-grad:linear-gradient(135deg,#1E8F4E 0%,#14653A 60%,#0C3D25 100%);
  --gl:rgba(61,220,132,.10); --bg:#071A12; --card:rgba(18,50,36,.82); --card-sub:rgba(22,60,43,.85);
  --tx:#EAF8F0; --mu:#8FB4A0; --bd:rgba(61,220,132,.16);
  --shadow:0 6px 22px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) {
    --g:#3DDC84; --g-dark:#22C55E;
    --g-grad:linear-gradient(135deg,#1E8F4E 0%,#14653A 60%,#0C3D25 100%);
    --gl:rgba(61,220,132,.10); --bg:#071A12; --card:rgba(18,50,36,.82); --card-sub:rgba(22,60,43,.85);
    --tx:#EAF8F0; --mu:#8FB4A0; --bd:rgba(61,220,132,.16);
    --shadow:0 6px 22px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  }

  }
}

function ensureJpegBase64(dataUri, cb){
  if(!dataUri) return cb(null, null);
  if(dataUri.indexOf('data:image/jpeg;base64,') === 0) return cb('image/jpeg', dataUri.split(';base64,')[1]);
  if(dataUri.indexOf('data:image/png;base64,') === 0) return cb('image/png', dataUri.split(';base64,')[1]);
  var img = new Image();
  img.onload = function(){
    try {
      var cv = document.createElement('canvas');
      cv.width = img.width || 300; cv.height = img.height || 200;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0);
      var j = cv.toDataURL('image/jpeg', 0.85);
      cb('image/jpeg', j.split(';base64,')[1]);
    } catch(e){ cb('image/jpeg', ''); }
  };
  img.onerror = function(){ cb('image/jpeg', ''); };
  img.src = dataUri;
}

/* ===== Server bilan aloqa =====
   Rasm va ma'lumotlar SIZNING serveringizga yuboriladi (kalitlar faqat serverda saqlanadi).
   verifyUrl bo'sh bo'lsa, ilova demo rejimda ishlaydi. Masalan: verifyUrl: '/api/verify' */
var LP_API = { verifyUrl: '' };

function prepPhoto(dataUri, cb){
  if(!dataUri) return cb(null, null);
  var img = new Image();
  img.onload = function(){
    try {
      var k = Math.min(1, 1280 / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      cb('image/jpeg', cv.toDataURL('image/jpeg', 0.82).split(';base64,')[1]);
    } catch(e){ ensureJpegBase64(dataUri, cb); }
  };
  img.onerror = function(){ ensureJpegBase64(dataUri, cb); };
  img.src = dataUri;
}

function callVerifyApi(base64Data, mimeType, cb){
  var act = ACTIONS[S.act], d = DISTR[S.user ? (S.user.d || 0) : 0];
  fetch(LP_API.verifyUrl, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      image: base64Data, mime: mimeType, action: S.act, actionKey: act.tKey, note: S.note || '',
      gps: S.gps ? {lat: S.gps.lat, lng: S.gps.lng, acc: S.gps.acc, real: !!S.gps.real} : null,
      user: S.user ? {name: S.user.name, phone: S.user.phone, district: d[0]} : null,
      lang: LANGS[S.lang], ts: new Date().toISOString()
    })
  })
  .then(function(res){ if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
  .then(function(r){ cb(null, r); })
  .catch(function(e){ cb(e, null); });
}

function submitAction(){
  S.stage = 1; S.res = null; render();
  if(!LP_API.verifyUrl){ runDemoAnalysis(); return; }
  prepPhoto(S.photo, function(mimeType, base64Data){
    if(!base64Data){ runDemoAnalysis(); return; }
    setTimeout(function(){ if(S.stage === 1){ S.stage = 2; render(); } }, 600);
    callVerifyApi(base64Data, mimeType, function(err, r){
      if(err || !r){ S.stage = 0; render(); toast('⚠️ Serverga ulanib bo‘lmadi. Qayta urinib ko‘ring.'); return; }
      S.stage = 3; render();
      setTimeout(function(){
        S.stage = 4; render();
        setTimeout(function(){
          var act = ACTIONS[S.act];
          S.res = {
            valid: !!r.valid,
            coins: r.valid ? (r.coins || act.c) : 0,
            trustScore: r.trustScore || (r.valid ? 92 : 20),
            summary: r.summary || '',
            reason: r.reason || 'Rad etildi'
          };
          S.stage = 5;
          if(r.valid){
            S.coins += S.res.coins;
            if(S.act === 0) S.trees++;
            else if(S.act === 1) S.clean++;
            else if(S.act === 2) S.reports++;
            incStreak();
          }
          render();
        }, 700);
      }, 600);
    });
  });
}

function runDemoAnalysis(){
  var act = ACTIONS[S.act];
  setTimeout(function(){ S.stage = 2; render(); }, 800);
  setTimeout(function(){ S.stage = 3; render(); }, 1600);
  setTimeout(function(){ S.stage = 4; render(); }, 2400);
  setTimeout(function(){
    S.stage = 5;
    S.res = {
      valid: true,
      coins: act.c,
      trustScore: 94,

    };
    S.coins += act.c;
    if(S.act === 0) S.trees++;

    render();
  }, 3200);
}

    if(S.user&&S.tab!=='home') _go('home');
  });
})();
</script>

<script>

      e.key === 'I' || e.key === 'i' || e.keyCode === 73 ||
